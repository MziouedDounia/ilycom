<template>
    <div class="box">
        <div class="title">Étape 5 : Confirmation & Création</div>
        
        <div class="recap">
            <div><b>Client:</b> {account.name}</div>
            <div><b>Type:</b> {offerType}</div>
            <div><b>Forfait:</b> {selectedPlan.name} — {selectedPlan.price}/mois</div>
            <div><b>Engagement:</b> {engText}</div>
            
            <template if:true={selectedDevice}>
                <div><b>Mobile:</b> {selectedDevice.name}</div>
            </template>
            
            <div><b>Début:</b> {startDate}</div>
        </div>

        <div class="actions">
            <lightning-button label="Retour" onclick={back}></lightning-button>
            <lightning-button variant="brand" label="Terminer et Activer" onclick={submit}></lightning-button>
        </div>
    </div>
</template>
