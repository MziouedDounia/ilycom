<template>
    <template if:true={isOpen}>
        <div class="backdrop" onclick={handleCancel}></div>

        <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-container" onclick={stopPropagation}>

                <!-- Header -->
                <header class="modal-header">
                    <div>
                        <h2 class="title">Étape 4 : Ajout d’un mobile (optionnel)</h2>
                        
                    </div>
                </header>

                <!-- Stepper -->
                <div class="stepper-container">
                    <div class="stepper-line"></div>
                    <div class="step done"><span>1</span></div>
                    <div class="step done"><span>2</span></div>
                    <div class="step done"><span>3</span></div>
                    <div class="step active"><span>4</span></div>
                    <div class="step"><span>5</span></div>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <template if:true={loading}>
                        <div class="muted">Chargement...</div>
                    </template>

                    <div class="grid">
                        <template for:each={devices} for:item="d">
                            <div key={d.productId} class={d._cls} data-id={d.productId} onclick={select} role="button" tabindex="0">
                                <div class="imgWrap">
                                    <img src={d.imageUrl} alt={d.name} class="img"/>
                                </div>

                                <div class="dTitle">{d.name}</div>
                                <div class="muted">{d.description}</div>
                                <div class="price">{d.price}</div>

                                <div class="pickBtn">Choisir</div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="modal-footer">
                    <div class="footer-actions">
                        <lightning-button
                            label="Retour"
                            variant="brand"
                            class="btn"
                            onclick={back}>
                        </lightning-button>

                        <lightning-button
                            label="Ignorer"
                            variant="brand"
                            class="btn ghost"
                            onclick={skip}>
                        </lightning-button>

                        <lightning-button
                            label="Suivant"
                            variant="brand"
                            class="btn"
                            onclick={next}>
                        </lightning-button>
                    </div>
                </footer>

            </div>
        </section>
    </template>
</template>
