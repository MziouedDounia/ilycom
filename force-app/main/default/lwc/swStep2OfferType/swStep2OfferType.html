<template>
    <template if:true={isOpen}>
        <!-- Backdrop -->
        <div class="backdrop" onclick={handleCancel}></div>

        <!-- Modal -->
        <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-container" onclick={stopPropagation}>

                <!-- Header -->
                <header class="modal-header">
                    <div>
                        <h2 class="title">Choix du Type d’Offre</h2>
                        
                    </div>
                </header>

                <!-- Stepper -->
                <div class="stepper-container">
                    <div class="stepper-line"></div>
                    <div class="step done"><span>1</span></div>
                    <div class="step active"><span>2</span></div>
                    <div class="step"><span>3</span></div>
                    <div class="step"><span>4</span></div>
                    <div class="step"><span>5</span></div>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <div class="cards">

                        <!-- Mobile -->
                        <div class={mobileCls} data-type="Mobile" onclick={pick} role="button" tabindex="0">
                            <div class="cardLeft">
                                <div class="cardTitle">Forfait Mobile</div>
                                
                            </div>

                            <div class="cardIcon">
                                <lightning-icon
                                    icon-name="utility:call"
                                    size="medium"
                                    alternative-text="Mobile">
                                </lightning-icon>

                            </div>
                        </div>

                        <!-- Fixe -->
                        <div class={fixeCls} data-type="Fixe" onclick={pick} role="button" tabindex="0">
                            <div class="cardLeft">
                                <div class="cardTitle">Forfait Fixe</div>
                                
                            </div>

                            <div class="cardIcon">
                                <lightning-icon
                                    icon-name="utility:wifi"
                                    size="medium"
                                    alternative-text="Fixe">
                                </lightning-icon>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <footer class="modal-footer">
                    <div class="footer-actions">
                        <lightning-button
                            label="Retour"
                            variant="brand"
                            class="btn"
                            onclick={back}>
                        </lightning-button>

                        <lightning-button
                            label="Suivant"
                            variant="brand"
                            class="btn"
                            onclick={next}
                            disabled={disableNext}>
                        </lightning-button>
                    </div>
                </footer>

            </div>
        </section>
    </template>
</template>
