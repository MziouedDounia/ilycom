<template>
    <template if:true={isOpen}>
        <div class="backdrop" onclick={handleCancel}></div>

        <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-container" onclick={stopPropagation}>

                <!-- Header -->
                <header class="modal-header">
                    <div>
                        <h2 class="title">Étape 3 : Sélection du forfait</h2>
                        
                    </div>
                </header>

                <!-- Stepper -->
                <div class="stepper-container">
                    <div class="stepper-line"></div>
                    <div class="step done"><span>1</span></div>
                    <div class="step done"><span>2</span></div>
                    <div class="step active"><span>3</span></div>
                    <div class="step"><span>4</span></div>
                    <div class="step"><span>5</span></div>
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <div class="box">

                        <!-- Toggle row -->
                        <!-- Toggle Engagement -->
                <div class="engagement-switch" onclick={toggleEngagement}>
                <div class="switch-track">
                    <div class={thumbClass}></div>
                    <span class={leftLabelClass}>Avec engagement</span>
                    <span class={rightLabelClass}>Sans engagement</span>
                </div>


                    </div>

                        <!-- Durée seulement si avec engagement -->
                        <template if:true={withEng}>
                            <div class="engRow">
                        <lightning-combobox
                            label="Durée (mois)"
                            value={months}
                            options={monthOptions}
                            onchange={handleMonthChange}
                            class="premium-combobox">
                        </lightning-combobox>
                    </div>

                        </template>

                        <!-- Loading -->
                        <template if:true={loading}>
                            <div class="muted">Chargement des forfaits...</div>
                        </template>

                        <!-- Plans -->
                        <div class="plans">
                            <template for:each={displayPlans} for:item="p">
                                <div
                                    key={p.productId}
                                    class={p._cls}
                                    data-id={p.productId}
                                    onclick={selectPlan}
                                    role="button"
                                    tabindex="0"
                                >
                                    <div class="planLeft">
                                        <div class="pTitle">{p.name}</div>
                                        <div class="muted">{p.description}</div>
                                        <div class="price">{p.price} / mois</div>
                                    </div>

                                    <div class="planBtn">Sélectionner</div>
                                </div>
                            </template>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <footer class="modal-footer">
                    <div class="footer-actions">
                        <lightning-button
                            label="Retour"
                            variant="brand"
                            class="btn"
                            onclick={back}>
                        </lightning-button>

                        <lightning-button
                            label="Suivant"
                            variant="brand"
                            class="btn"
                            onclick={next}
                            disabled={disableNext}>
                        </lightning-button>
                    </div>
                </footer>

            </div>
        </section>
    </template>
</template>
