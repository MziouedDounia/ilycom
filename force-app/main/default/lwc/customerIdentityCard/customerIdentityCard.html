<template>
  <section class="card">
    <div class="header">
      <div class="avatar" title="Client"></div>

      <div class="meta">
        <div class="name">{accountName}</div>
        <div class="sub">{subtitle}</div>

        <div class="icons">
          <span class="i" title="Téléphone">📞</span>
          <span class="i" title="Email">✉️</span>
          <span class="i" title="Contrat">🧾</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <lightning-button
        variant="brand"
        label="Ouvrir le compte"
        onclick={openAccount}>
      </lightning-button>

      <lightning-button
        label="Créer une demande"
        onclick={mockCreateRequest}>
      </lightning-button>
    </div>
  </section>
</template>
